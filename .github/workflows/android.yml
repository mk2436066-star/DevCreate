name: Build DevCreate APK

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android project
    run: unzip DevCreate.apk-build.zip -d source

  - name: Build APK
    working-directory: source/DevCreateAndroid
    run: gradle --no-daemon assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: DevCreate-APK
      path: source/DevCreateAndroid/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
